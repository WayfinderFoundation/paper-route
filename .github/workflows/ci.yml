name: ci

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build:release
      - uses: actions/upload-artifact@v4
        with:
          name: paper-route
          path: release/*.zip
      - name: Attach the zip to the GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test "v$(node -p 'require("./manifest.json").version')" = "$GITHUB_REF_NAME" || { echo "tag $GITHUB_REF_NAME doesn't match manifest version"; exit 1; }
          gh release create "$GITHUB_REF_NAME" release/*.zip --title "Paper Route $GITHUB_REF_NAME" --generate-notes
